<!doctype html>
<html lang="en-GB">

<head>
  <!-- Google tag (Ads + GA4): deliberately not loaded here. It is injected by
       src/lib/consent.ts only after the visitor accepts in the cookie banner,
       so nothing reaches Google Ads or Analytics before consent. -->
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DPF Cleaning &amp; ECU Remapping Devon | AutoCleanse</title>
  <meta name="theme-color" content="#FF7A00" />
  <!-- Preload the hero background so it can start downloading before CSS is
       parsed; it is the largest paint in the above-the-fold hero. -->
  <link rel="preload" as="image" href="/honeycomb-bg.webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Load the font stylesheet without blocking first render. display=swap means
       text paints immediately in the fallback face and swaps to the web font when
       it arrives, so typography is unchanged but FCP is not held up ~800ms. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
